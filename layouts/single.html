{{ define "main" }}
  <div class="docs-layout">
    {{ partial "docs-sidebar" . }}

    <article class="docs-content">
      <header class="page-header">
        <h1>{{ .Title }}</h1>
        {{ with .Description }}
          <p>{{ . }}</p>
        {{ end }}
        {{ with .Params.cadence }}
          <p>Updates: {{ . }}.</p>
        {{ end }}
        {{ partial "release-line" . }}
      </header>

      <div class="prose">
        {{ .Content }}
      </div>

      {{ partial "page-nav" . }}
    </article>

    {{ partial "page-toc" . }}
  </div>
{{ end }}
